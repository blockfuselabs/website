name: Deploy Blockfuselabs Website to cPanel

on:
  push:
    branches:
      - frontend-main

jobs:
  FTP-Deploy-Action:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: 🧐 Check directory
        run: ls -la
      
      - name: 🛠 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      # --- Blockfuse Website Build & Deploy ---
      - name: 📦 Install dependencies (blockfuse-website)
        working-directory: blockfuse-website
        run: npm install

      - name: 🔨 Build React app (blockfuse-website)
        working-directory: blockfuse-website
        run: npm run build

      - name: 🚀 Deploy blockfuse-website to cPanel
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ vars.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: blockfuse-website/dist/

      # --- Blogsite Build & Deploy ---
      - name: 📦 Install dependencies (blogsite)
        working-directory: blogsite
        run: npm install

      - name: 🔨 Build React app (blogsite)
        working-directory: blogsite
        run: npm run build

      - name: 🚀 Deploy blogsite to cPanel
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ vars.FTP_PASSWORD }}
          server-dir: blog.blockfuselabs.com/
          local-dir: blogsite/dist/